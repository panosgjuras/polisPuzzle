[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polispuzzle"
version = "0.1.0"
description = "Transport modelling toolkit"
requires-python = ">=3.10"
dependencies = [
    "geopandas",
    "matplotlib",
    "networkx",
    "osmnx",
    "pandas",
    "openpyxl",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
